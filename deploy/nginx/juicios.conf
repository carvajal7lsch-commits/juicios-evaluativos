# ================================================================
# nginx — Juicios Evaluativos
#
# Instalación en el VPS:
#   sudo cp deploy/nginx/juicios.conf /etc/nginx/sites-available/juicios
#   sudo ln -s /etc/nginx/sites-available/juicios /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, el certificado:
#   sudo certbot --nginx -d juicios.secarvajal.com
#
# Certbot reescribe este archivo solo: añade el server de 443 con el
# certificado y convierte este de 80 en una redirección a https.
# ================================================================

server {
    listen 80;
    listen [::]:80;

    server_name juicios.secarvajal.com;
    # Si tienes registro DNS para www, añádelo aquí y en el comando de
    # certbot. Si no lo tienes, dejarlo puesto hace fallar el certificado.
    # server_name juicios.secarvajal.com www.juicios.secarvajal.com;

    # La importación de reportes de Sofía Plus parsea el Excel en el
    # navegador y lo envía entero como un único POST JSON. El límite por
    # defecto de nginx es 1 MB y cortaría la petición con un 413.
    # Este valor debe ir acorde con post_max_size de docker/php.ini.
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:9081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una importación grande puede tardar; PHP admite hasta 300s.
        # El valor por defecto de nginx (60s) daría un 504 antes de tiempo.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # El healthcheck no necesita quedar registrado en el access log
    location = /health.php {
        proxy_pass http://127.0.0.1:9081/health.php;
        proxy_set_header Host $host;
        access_log off;
    }
}
