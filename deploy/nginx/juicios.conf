# ================================================================
# nginx — Juicios Evaluativos
#
# Camino de una petición:
#   nginx (80/443, certbot)  ->  dokploy-traefik (9080)  ->  contenedor app
#
# Traefik elige el contenedor por el header Host, así que 'proxy_set_header
# Host $host' es imprescindible: sin él responde 404. Mismo patrón que los
# sites de lyd y smashcode.
#
# Requisito previo: en Dokploy, pestaña Domains del servicio, añadir el
# dominio apuntando a service 'app' / port 80, con HTTPS DESACTIVADO — el
# certificado lo gestiona certbot aquí en nginx, no Traefik.
#
# Instalación:
#   sudo cp deploy/nginx/juicios.conf #        /etc/nginx/sites-available/juiciosena.secarvajal.com
#   sudo ln -s /etc/nginx/sites-available/juiciosena.secarvajal.com #        /etc/nginx/sites-enabled/juiciosena.secarvajal.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d juiciosena.secarvajal.com
# ================================================================

server {
    server_name juiciosena.secarvajal.com;

    # La importación de reportes de Sofía Plus parsea el Excel en el
    # navegador y lo manda entero en un único POST JSON. nginx es el
    # primero en recibirlo y su límite por defecto es 1 MB: sin esto
    # responde 413 antes de que la petición llegue siquiera a Traefik.
    # Debe ir acorde con post_max_size de docker/php.ini.
    client_max_body_size 64M;

    location / {
        proxy_pass http://localhost:9080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una importación grande puede tardar; PHP admite hasta 300s y el
        # defecto de nginx son 60s, que cortaría con un 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 80;
}
