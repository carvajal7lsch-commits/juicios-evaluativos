# ================================================================
# Juicios Evaluativos — PRODUCCIÓN en VPS con Dokploy
#
# Este es el archivo POR DEFECTO: Dokploy lo toma sin tocar "Compose Path".
# Para levantar el entorno local usa docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# En Dokploy:
#   1. Crear servicio tipo "Compose" apuntando a este repositorio.
#   2. Compose Path: dejar vacío (./docker-compose.yml).
#   3. Cargar las variables de entorno (ver .env.example).
#   4. El dominio NO se configura en Dokploy: lo sirve nginx del host
#      (ver deploy/nginx/juicios.conf).
#
# El servicio 'app' publica el puerto 9081 SOLO en 127.0.0.1: nginx del
# host hace de proxy inverso hacia él y certbot gestiona el certificado.
# El servicio 'db' queda aislado en la red interna, sin exposición alguna.
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: utf8mb4
    ports:
      # El puerto del host se elige con APP_PORT (variable de entorno en
      # Dokploy). No puede ser uno ya ocupado: el contenedor trae su propio
      # Apache, así que necesita un puerto para él solo.
      # 127.0.0.1 es imprescindible: sin esa IP, Docker abre el puerto a
      # internet saltándose las reglas de UFW.
      - "127.0.0.1:${APP_PORT:-9081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      - "app=juicios-evaluativos"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez (volumen vacío). En despliegues
      # posteriores se ignoran y los datos existentes se conservan.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/migracion_programa_resultado.sql:/docker-entrypoint-initdb.d/02-migracion.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  # Red de Dokploy. El tráfico web no entra por aquí (lo trae nginx), pero
  # se mantiene para que Dokploy gestione el servicio con normalidad.
  dokploy-network:
    external: true
  # Red privada app <-> base de datos
  internal:
    driver: bridge
