# ================================================================
# Juicios Evaluativos — PRODUCCIÓN en VPS con Dokploy
#
# Este es el archivo POR DEFECTO: Dokploy lo toma sin tocar "Compose Path".
# Para levantar el entorno local usa docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# En Dokploy:
#   1. Crear servicio tipo "Compose" apuntando a este repositorio.
#   2. Compose Path: dejar vacío (./docker-compose.yml).
#   3. Cargar las variables de entorno (ver .env.example).
#   4. En "Domains" añadir el dominio -> service: app, port: 80.
#
# El servicio 'app' NO publica puertos: el tráfico entra por Traefik
# a través de la red 'dokploy-network'. El servicio 'db' queda aislado
# en la red interna, sin exposición al exterior.
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: utf8mb4
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      # Dokploy genera estas etiquetas al añadir el dominio desde la UI.
      # Descoméntalas solo si prefieres configurar Traefik a mano.
      # - "traefik.enable=true"
      # - "traefik.http.routers.juicios.rule=Host(`juicios.tudominio.com`)"
      # - "traefik.http.routers.juicios.entrypoints=websecure"
      # - "traefik.http.routers.juicios.tls.certresolver=letsencrypt"
      # - "traefik.http.services.juicios.loadbalancer.server.port=80"
      - "app=juicios-evaluativos"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez (volumen vacío). En despliegues
      # posteriores se ignoran y los datos existentes se conservan.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/migracion_programa_resultado.sql:/docker-entrypoint-initdb.d/02-migracion.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  # Red creada por Dokploy en el VPS: por aquí entra Traefik
  dokploy-network:
    external: true
  # Red privada app <-> base de datos
  internal:
    driver: bridge
