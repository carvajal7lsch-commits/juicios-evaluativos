# ================================================================
# Juicios Evaluativos — PRODUCCIÓN en VPS con Dokploy
#
# Este es el archivo POR DEFECTO: Dokploy lo toma sin tocar "Compose Path".
# Para levantar el entorno local usa docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# En Dokploy:
#   1. Crear servicio tipo "Compose" apuntando a este repositorio.
#   2. Compose Path: dejar vacío (./docker-compose.yml).
#   3. Cargar las variables de entorno (ver .env.example).
#   4. En "Domains" añadir el dominio -> service: app, port: 80, HTTPS
#      DESACTIVADO (el certificado lo pone certbot en nginx, no Traefik).
#   5. Crear el site de nginx (ver deploy/nginx/juicios.conf).
#
# Ningún servicio publica puertos en el host. El camino es:
#
#   nginx (80/443, certbot)  ->  dokploy-traefik (9080)  ->  app (80)
#
# nginx conserva el header Host, Traefik lo usa para elegir el contenedor
# según el dominio configurado en Dokploy. 'db' solo la alcanza 'app'.
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: utf8mb4
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      - "app=juicios-evaluativos"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez (volumen vacío). En despliegues
      # posteriores se ignoran y los datos existentes se conservan.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/migracion_programa_resultado.sql:/docker-entrypoint-initdb.d/02-migracion.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  # Red de Dokploy: por aquí Traefik alcanza al contenedor. Sin esto el
  # dominio no resuelve por mucho que se configure en la UI.
  dokploy-network:
    external: true
  # Red privada app <-> base de datos
  internal:
    driver: bridge
