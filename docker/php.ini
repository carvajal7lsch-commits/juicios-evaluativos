; ================================================================
; Ajustes PHP para producción — Juicios Evaluativos
; ================================================================

; La importación de reportes de Sofía Plus se parsea en el navegador
; y se envía como un único POST JSON: necesita límites holgados.
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
max_input_time = 300
max_execution_time = 300

; Errores: se registran, nunca se muestran al usuario final
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Zona horaria de Colombia
date.timezone = America/Bogota

; Sesiones
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 7200

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

expose_php = Off
