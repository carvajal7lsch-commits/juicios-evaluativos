<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # --- Directorios que NUNCA deben servirse por HTTP -----------
    <DirectoryMatch "^/var/www/html/(config|sql|scratch|docker|\.git)">
        Require all denied
    </DirectoryMatch>

    # --- Archivos sensibles en la raíz --------------------------
    <FilesMatch "^(\.env.*|Dockerfile|docker-compose.*\.ya?ml|\.dockerignore|\.gitignore|README\.md)$">
        Require all denied
    </FilesMatch>

    # --- Cabeceras de seguridad ---------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Caché de estáticos -------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType image/svg+xml "access plus 30 days"
    </IfModule>

    # --- Logs a stdout/stderr (los recoge Docker/Dokploy) -------
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
